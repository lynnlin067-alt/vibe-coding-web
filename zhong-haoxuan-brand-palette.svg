<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#132B27" flood-opacity=".13"/></filter>
    <style>
      .h{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;font-weight:800;fill:#132B27}
      .b{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;font-weight:400;fill:#51615D}
      .s{font-family:Arial,'Noto Sans TC',sans-serif;font-weight:700;letter-spacing:2px}
      .card{fill:#fffdf8;stroke:#E8E1D6;stroke-width:1}
    </style>
  </defs>
  <rect width="1600" height="1200" fill="#F7F3EA"/>
  <rect x="0" y="0" width="1600" height="16" fill="#C98835"/>
  <circle cx="1450" cy="130" r="210" fill="#F3E3BD"/><circle cx="1510" cy="235" r="150" fill="#E7A96A" opacity=".28"/>
  <text x="110" y="126" class="s" font-size="18" fill="#C98835">BRAND COLOR SYSTEM / 2026</text>
  <text x="110" y="194" class="h" font-size="50">鍾皓軒｜AI × 數據 × 成長策略顧問</text>
  <text x="110" y="238" class="b" font-size="22">以「茶韻的深度、果香的親和、科技的清晰」建立一個值得信賴、能帶來行動的 AI 品牌。</text>
  <g transform="translate(110 300)">
    <rect class="card" width="1380" height="194" rx="22" filter="url(#shadow)"/>
    <rect x="0" y="0" width="14" height="194" rx="7" fill="#132B27"/>
    <text x="48" y="55" class="s" font-size="15" fill="#C98835">COLOR STRATEGY / 色彩策略</text>
    <text x="48" y="103" class="h" font-size="27">第一眼先感到「沉穩可信」，停留後感到「有溫度、願意行動」。</text>
    <text x="48" y="145" class="b" font-size="19">深墨綠建立資料與策略顧問的專業信任；茶金帶出洞察與經驗；果香珊瑚將 CTA、關鍵數字與亮點轉為清楚的下一步。</text>
  </g>
  <text x="110" y="570" class="s" font-size="18" fill="#C98835">CORE PALETTE / 核心色票</text>
  <g transform="translate(110 610)">
    <rect class="card" width="650" height="308" rx="22" filter="url(#shadow)"/>
    <rect x="36" y="34" width="578" height="84" rx="14" fill="#132B27"/>
    <text x="58" y="68" class="s" font-size="13" fill="#F5D68E">PRIMARY / 主色</text><text x="58" y="100" font-family="Arial" font-size="23" font-weight="700" fill="#fff">#132B27  Deep Tea Ink</text>
    <text x="36" y="162" class="h" font-size="19">深茶墨綠：策略、穩定與專業判斷</text><text x="36" y="194" class="b" font-size="16">用途：導覽列、深色區塊、標題、資料圖表基底</text>
    <rect x="36" y="222" width="270" height="50" rx="10" fill="#F7F3EA"/><text x="52" y="253" font-family="Arial" font-size="16" font-weight="700" fill="#132B27">On-light text  #132B27</text>
    <rect x="324" y="222" width="290" height="50" rx="10" fill="#132B27"/><text x="340" y="253" font-family="Arial" font-size="16" font-weight="700" fill="#fff">On-dark text  #FFFFFF</text>
  </g>
  <g transform="translate(840 610)">
    <rect class="card" width="650" height="308" rx="22" filter="url(#shadow)"/>
    <rect x="36" y="34" width="272" height="84" rx="14" fill="#C98835"/><text x="58" y="68" class="s" font-size="13" fill="#fff">SECONDARY / 輔助色</text><text x="58" y="100" font-family="Arial" font-size="22" font-weight="700" fill="#fff">#C98835  Insight Gold</text>
    <rect x="342" y="34" width="272" height="84" rx="14" fill="#E9795B"/><text x="364" y="68" class="s" font-size="13" fill="#fff">ACCENT / 強調色</text><text x="364" y="100" font-family="Arial" font-size="21" font-weight="700" fill="#fff">#E9795B  Growth Coral</text>
    <text x="36" y="162" class="h" font-size="19">茶金：洞察與經驗　　　珊瑚：親和與行動</text>
    <text x="36" y="194" class="b" font-size="16">茶金用於分類、引用、資料亮點；珊瑚僅用於主 CTA、通知與關鍵轉換點。</text>
    <rect x="36" y="224" width="182" height="48" rx="10" fill="#E9F0EC"/><text x="52" y="254" font-family="Arial" font-size="15" font-weight="700" fill="#132B27">#E9F0EC  Sage Mist</text>
    <rect x="234" y="224" width="182" height="48" rx="10" fill="#F5D68E"/><text x="250" y="254" font-family="Arial" font-size="15" font-weight="700" fill="#132B27">#F5D68E  Tea Cream</text>
    <rect x="432" y="224" width="182" height="48" rx="10" fill="#F7F3EA" stroke="#E8E1D6"/><text x="448" y="254" font-family="Arial" font-size="15" font-weight="700" fill="#132B27">#F7F3EA  Rice Paper</text>
  </g>
  <g transform="translate(110 988)">
    <text x="0" y="0" class="s" font-size="18" fill="#C98835">WEB COLOR RATIO / 網頁黃金比例</text>
    <circle cx="150" cy="100" r="70" fill="none" stroke="#F7F3EA" stroke-width="42"/>
    <circle cx="150" cy="100" r="70" fill="none" stroke="#132B27" stroke-width="42" stroke-dasharray="264 176" stroke-dashoffset="0" transform="rotate(-90 150 100)"/>
    <circle cx="150" cy="100" r="70" fill="none" stroke="#C98835" stroke-width="42" stroke-dasharray="132 308" stroke-dashoffset="-264" transform="rotate(-90 150 100)"/>
    <circle cx="150" cy="100" r="70" fill="none" stroke="#E9795B" stroke-width="42" stroke-dasharray="44 396" stroke-dashoffset="-396" transform="rotate(-90 150 100)"/>
    <text x="150" y="96" text-anchor="middle" class="h" font-size="26">60/30/10</text><text x="150" y="121" text-anchor="middle" class="b" font-size="14">品牌平衡</text>
    <g transform="translate(300 30)"><rect width="18" height="18" rx="4" fill="#F7F3EA" stroke="#E8E1D6"/><text x="30" y="16" class="h" font-size="17">60% 中性底色</text><text x="200" y="16" class="b" font-size="16">#F7F3EA / 大面積留白、閱讀內容</text>
    <rect y="42" width="18" height="18" rx="4" fill="#132B27"/><text x="30" y="58" class="h" font-size="17">30% 主體色系</text><text x="200" y="58" class="b" font-size="16">#132B27 / 品牌區塊、標題、導覽</text>
    <rect y="84" width="18" height="18" rx="4" fill="#E9795B"/><text x="30" y="100" class="h" font-size="17">10% 強調色</text><text x="200" y="100" class="b" font-size="16">#E9795B + #C98835 / CTA、數字、標籤</text></g>
  </g>
  <text x="110" y="1160" class="b" font-size="15">Consistency rule：一個畫面只保留一個高彩度行動色；深墨綠與米白始終構成穩定閱讀對比。</text>
</svg>
